[project]
name = "universal-portfolios"
version = "0.4.17"
description = "Collection of algorithms for online portfolio selection"
readme = "README.md"
authors = [
    {name = "Marigold", email = "mojmir.vinkler@gmail.com"},
]
requires-python = ">=3.11, <3.15"
dependencies = [
    "scipy>=1.8.1",
    "matplotlib>=3.3.1",
    "pandas-datareader>=0.10.0",
    "statsmodels>=0.14.5",
    "scikit-learn>=1.1.1",
    "seaborn>=0.13.2",
    "requests>=2.24.0",
    "plotly>=6.0.0",
    "pandas>=2.3.3,<3",
    "cvxopt>=1.3.3",
    "tqdm>=4.56.2",
    "urllib3>=2.7.0",
    "Pillow>=12.3.0",
    "yfinance>=0.2.31",
    "numpy>=2.0.0",
]

[project.urls]
Repository = "https://github.com/Marigold/universal-portfolios"

[tool.uv]
exclude-newer = "3 days"
# ruff/ty are pinned exactly below, so the rolling cutoff only needs to
# allow picking whatever their currently-pinned release is.
exclude-newer-package = { ruff = "2030-01-01T00:00:00Z", ty = "2030-01-01T00:00:00Z" }

[dependency-groups]
# Just what `make test` needs. CI installs only this, skipping the jupyter stack:
# 57 packages instead of 147.
ci = [
    "pytest>=9.0.3",
    # Both pinned exactly: a new ruff changes the default rule set and the
    # formatter, and a new ty always finds new errors. Either turns CI red with
    # no code change, so upgrades happen deliberately.
    "ruff==0.16.0",
    "ty==0.0.65",
]
dev = [
    {include-group = "ci"},
    "typing-extensions>=4.0.1",
    "ipdb>=0.13.3",
    "line-profiler>=5.0.1",
    "ipykernel>=5.3.4",
    "jupyter>=1.0.0",
    "nbdime>=2.1.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 88
lint.ignore = [
    "F403",
    "F405",
    "E731",
    "E741",
    "DTZ",      # naive dates are the convention in these trading repos; adding tzinfo changes behaviour
    "LOG015",   # this codebase has no per-module loggers anywhere; adopting one is a design decision, not lint fallout
    "TRY002",   # raising vanilla Exception is the existing convention; a custom hierarchy is a design decision
]

[tool.hatch.build.targets.wheel]
packages = ["universal"]

[tool.ty.src]
exclude = [
    "**/node_modules",
    "**/__pycache__",
    "**/.venv",
    "**/.ipynb_checkpoints",
    ".git",
    "**/.cachedir/",
    "**/.cache/",
]

[tool.ty.rules]
# Noisy with pandas/numpy stubs — see etl for the same pattern
invalid-argument-type = "ignore"
no-matching-overload = "ignore"
invalid-method-override = "ignore"
unused-ignore-comment = "ignore"
unused-type-ignore-comment = "ignore"
