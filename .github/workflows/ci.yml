name: CI

on:
  push:
    branches: [master]
  pull_request:

# A new push to a PR makes the in-flight run pointless.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Keep in sync with requires-python in pyproject.toml.
        python-version: ["3.11", "3.12", "3.13", "3.14"]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # v9.0.0 is the action's version; `version` below is uv's own. Pinned so a
      # uv release can't turn CI red on its own. setup-uv publishes no floating
      # v9 major tag, hence the exact action version too.
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: "0.12.0"
          enable-cache: true

      # Installs via default.mk's .venv target, so there's no second sync here.
      # The ci group skips the jupyter stack; no --locked because
      # exclude-newer = "3 days" expires the lockfile daily by design.
      - name: Run checks
        run: |
          make test \
            PYTHON_VERSION=${{ matrix.python-version }} \
            UV_SYNC_ARGS="--no-default-groups --group ci"
